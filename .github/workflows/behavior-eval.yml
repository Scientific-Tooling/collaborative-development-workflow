name: Manual Codex behavior evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-pretty:
    # Runner commands get unrestricted Docker-bridge egress. Keep this on a
    # disposable GitHub-hosted runner, not a host with trusted LAN access.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: codex-behavior-eval
    env:
      CODEX_NPM_VERSION: "0.154.0"
      PYTHON_BASE_IMAGE: "python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285"
      NODE_BASE_IMAGE: "node:22-bookworm-slim@sha256:83f487e0a63425e5b4d146fb5e5be574bcbe1b7b843d3ebafdd95eaf7767a7e5"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Prepare local runner and validation images before secrets
        run: |
          docker pull "$PYTHON_BASE_IMAGE"
          docker build --pull=false --tag cdw-validation:python3.13 \
            --build-arg BASE_IMAGE="$PYTHON_BASE_IMAGE" -f - . <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          LABEL org.opencontainers.image.title="Codex Skill behavior validation"
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
          docker pull "$NODE_BASE_IMAGE"
          docker build --pull=false --tag cdw-runner:codex-current \
            --build-arg BASE_IMAGE="$NODE_BASE_IMAGE" \
            --build-arg CODEX_NPM_VERSION="$CODEX_NPM_VERSION" -f - . <<'DOCKERFILE'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          ARG CODEX_NPM_VERSION
          LABEL org.opencontainers.image.title="Codex Skill behavior runner"
          RUN apt-get update \
              && apt-get install -y --no-install-recommends ca-certificates git python3 \
              && rm -rf /var/lib/apt/lists/*
          RUN npm install --global "@openai/codex@${CODEX_NPM_VERSION}"
          RUN mkdir -p /opt/cdw-runner
          COPY assets/cdw-reviewer.toml /opt/cdw-runner/cdw-reviewer.toml
          RUN printf '%s\n' \
              'sandbox_mode = "workspace-write"' \
              'approval_policy = "never"' \
              > /opt/cdw-runner/config.toml \
              && printf '%s\n' \
              '#!/bin/sh' \
              'set -eu' \
              ': "${HOME:?}" "${CODEX_HOME:?}" "${CDW_EVAL_SKILL_PATH:?}" "${CDW_EVAL_SKILL_NAME:?}"' \
              'mkdir -p "$HOME/.agents/skills" "$CODEX_HOME/agents"' \
              'cp /opt/cdw-runner/config.toml "$CODEX_HOME/config.toml"' \
              'cp /opt/cdw-runner/cdw-reviewer.toml "$CODEX_HOME/agents/cdw-reviewer.toml"' \
              'ln -s "$CDW_EVAL_SKILL_PATH" "$HOME/.agents/skills/$CDW_EVAL_SKILL_NAME"' \
              'exec "$@"' \
              > /usr/local/bin/cdw-runner-entrypoint \
              && chmod 0755 /usr/local/bin/cdw-runner-entrypoint
          ENTRYPOINT ["/usr/local/bin/cdw-runner-entrypoint"]
          DOCKERFILE
          VALIDATION_IMAGE_ID="$(docker image inspect --format '{{.Id}}' cdw-validation:python3.13)"
          RUNNER_IMAGE_ID="$(docker image inspect --format '{{.Id}}' cdw-runner:codex-current)"
          docker run --rm --pull=never --network=none \
            "$VALIDATION_IMAGE_ID" python3 --version
          docker run --rm --pull=never --network=none \
            "$VALIDATION_IMAGE_ID" git --version
          OBSERVED_CODEX_VERSION="$(docker run --rm --pull=never --network=none \
            --read-only --user="$(id -u):$(id -g)" \
            --tmpfs=/tmp:rw,nosuid,nodev,size=536870912,mode=1777 \
            --mount="type=bind,source=$PWD,target=/workspace,readonly" \
            --env=HOME=/tmp/home --env=CODEX_HOME=/tmp/home/.codex \
            --env=CDW_EVAL_SKILL_PATH=/workspace \
            --env=CDW_EVAL_SKILL_NAME=collaborative-development-workflow \
            "$RUNNER_IMAGE_ID" /bin/sh -c \
            'test -r "$CODEX_HOME/config.toml" && test -r "$CODEX_HOME/agents/cdw-reviewer.toml" && test -L "$HOME/.agents/skills/$CDW_EVAL_SKILL_NAME" && test -r "$HOME/.agents/skills/$CDW_EVAL_SKILL_NAME/SKILL.md" && codex --version')"
          test "$OBSERVED_CODEX_VERSION" = "codex-cli $CODEX_NPM_VERSION"
          {
            echo "VALIDATION_IMAGE_ID=$VALIDATION_IMAGE_ID"
            echo "RUNNER_IMAGE_ID=$RUNNER_IMAGE_ID"
            echo "OBSERVED_CODEX_VERSION=$OBSERVED_CODEX_VERSION"
          } >> "$GITHUB_ENV"
      - name: Run the isolated behavior case
        id: behavior_eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          REPORT_DIRECTORY="$(/usr/bin/mktemp -d "$RUNNER_TEMP/cdw-behavior-report.XXXXXXXX")"
          REPORT_PATH="$REPORT_DIRECTORY/report.json"
          PUBLICATION_MARKER="$REPORT_DIRECTORY/published.sha256"
          set +e
          python scripts/behavior_eval.py \
            --case evals/doctor-pretty.json \
            --source-root . \
            --skill-path . \
            --runner-json '["codex", "exec", "--ephemeral"]' \
            --runner-isolation docker \
            --runner-image "$RUNNER_IMAGE_ID" \
            --runner-tool-version "$OBSERVED_CODEX_VERSION" \
            --validation-isolation docker \
            --validation-image "$VALIDATION_IMAGE_ID" \
            --report "$REPORT_PATH" \
            --publication-marker "$PUBLICATION_MARKER"
          EVALUATION_STATUS="$?"
          set -e
          if python3 - "$REPORT_PATH" "$PUBLICATION_MARKER" <<'PY'
          import hashlib
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1]).read_bytes()
          marker = pathlib.Path(sys.argv[2]).read_text(encoding="ascii")
          expected = hashlib.sha256(report).hexdigest() + "\n"
          raise SystemExit(0 if marker == expected else 1)
          PY
          then
            {
              echo "artifact_ready=true"
              echo "report_path=$REPORT_PATH"
            } >> "$GITHUB_OUTPUT"
          else
            echo "artifact_ready=false" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          exit "$EVALUATION_STATUS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && steps.behavior_eval.outputs.artifact_ready == 'true' }}
        with:
          name: behavior-eval-report
          path: ${{ steps.behavior_eval.outputs.report_path }}
          if-no-files-found: warn
