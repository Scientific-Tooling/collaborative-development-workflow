name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check scripts tests evals/deterministic-regression-runner.py
      - run: python -m unittest discover -s tests -v
      - name: Run deterministic behavior regression
        run: |
          WORKSPACE_ROOT="$(mktemp -d "$RUNNER_TEMP/cdw-deterministic.XXXXXXXX")"
          trap 'rm -rf "$WORKSPACE_ROOT"' EXIT
          PYTHON="$(command -v python3)"
          PYTHON_DIR="$(dirname "$PYTHON")"
          env -i PATH="$PYTHON_DIR:/usr/bin:/bin" unshare --user --map-root-user --net --kill-child -- "$PYTHON" scripts/behavior_eval.py \
            --case evals/deterministic-regression.json \
            --source-root . \
            --skill-path . \
            --runner-json '["python3", "evals/deterministic-regression-runner.py"]' \
            --runner-isolation unsafe-direct \
            --validation-isolation unsafe-direct \
            --workspace "$WORKSPACE_ROOT/workspace"
      - name: Smoke test helper CLIs
        if: matrix.python-version == '3.13'
        run: |
          python scripts/validate_metadata.py --root .
          python scripts/doctor.py --root . --preflight examples/capability_preflight.json
